<div class="row mb-3" *ngIf="percentualUsedDisk>0">
    <div class="col-12">
        <div class="progress">
            <div class="progress-bar" role="progressbar" style="width:{{percentualUsedDisk*100}}%;"  aria-valuemin="0" aria-valuemax="100">Usage {{percentualUsedDisk|percent}}</div>
        </div>

        
    </div>
</div>

<div class="row">
    <div class="col-12">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Date</th>
                    <th scope="col">Type</th>
                    <th scope="col">Files</th>
                    <!--<th></th>-->
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let d of datasets">
                    <td>
                        <a (click)="openDetail(d.dataset_id)">{{d.dataset_id}}</a></td>
                    <td>{{d.created_at | date:"dd/MM/YYYY HH:mm"}}</td>
                    <td>{{d.type}}</td>
                    <td>
                        <span *ngIf="d.camera_data">{{d.camera_data.items | number}}</span>
                    </td>
                    <!--<td>
                        <button title="delete dataset" class="btn btn-outline-danger"><i class="fa fa-trash"></i></button>
                    </td>-->
                </tr>                
            </tbody>
        </table>
    </div>
</div>

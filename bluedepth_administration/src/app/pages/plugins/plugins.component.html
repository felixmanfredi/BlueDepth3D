<div class="row">
    <div class="col-12" *ngFor="let p of plugins">
        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-10">
                        <h5 class="card-title">{{p.name}}</h5>
                        <div>Version: {{p.version}}</div>
                    </div>
                    <div class="col-2 text-right">
                        <i class="text-success fas fa-check fa-2x"></i>
                    </div>
                </div>
               
            </div>
            <div class="card-body">
                <div class="row">
                   <app-bluedepthsettings *ngIf="p.type=='stereocamera'"></app-bluedepthsettings>
                </div>
            </div>
            
         
        </div>
    </div>
</div>

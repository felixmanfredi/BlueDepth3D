                <div class="card mb-4">
                    <!-- <div class="card-header bg-success text-white"> -->
                    <div class="card-header text-white" [ngClass]="health ? 'bg-success' : 'bg-danger'">
                        <div class="d-flex align-items-center">
                        <div class="icon-shape icon-lg  rounded me-3 ">
                            <i class="fas fa-microchip fa-lg"></i>
                        </div>
                        <div>
                            <h5 class="mb-1">System</h5>
                        </div>
                        </div>
                    
                    </div>
                    <div class="card-body p-3">
                        <div class="row">
                            <div class="col-12 colg-4">
                                <table class="table table-borderless table-sm mb-0">
                                    <tbody>
                                        <tr>
                                            <td>
                                                <label>Date:</label>
                                            </td>
                                            <td class="text-end">
                                                {{ dateTime | date:'dd/MM/yyyy HH:mm:ss':'UTC' }}
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <label>Temperature:</label>
                                            </td>
                                            <td class="text-end">
                                                {{ temperature }}°C
                                            </td>
                                        </tr>       
                                        
                                <tr>
                                    <td>
                                        <label>Status:</label>
                                    </td>
                                    <td class="text-end">
                                        <div class="badge rounded-pill" [ngClass]="health ? 'bg-success' : 'bg-danger'">
                                            {{ health ? 'Healthy' : 'Error' }}
                                        </div>
                                    </td>
                                </tr>                                           
                                        <!-- <tr>
                                            <td>
                                                <label>% CPU Usage:</label>
                                            </td>
                                            <td class="text-end">
                                                0%
                                            </td>
                                        </tr> -->
